<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>RSVP | Adil & Mahek</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, serif;

    background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.70)),
        url("background.jpg");

    background-size: cover;
    background-position: center;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 40px 20px;
}

.rsvp-box {
    width: 100%;
    max-width: 550px;

    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(8px);

    border: 1px solid rgba(255,255,255,0.4);

    padding: 45px 40px;

    text-align: center;

    border-radius: 20px;
}

.small {
    letter-spacing: 5px;
    font-size: 13px;
    color: #f4a6b8;
}

h1 {
    font-size: 48px;
    margin: 15px 0;

    color: #ffd6df;
}

.subtitle {
    font-size: 18px;
    line-height: 1.7;

    margin-bottom: 15px;
}

.details {
    font-size: 15px;
    line-height: 1.8;

    color: #f9e8eb;

    margin-bottom: 30px;
}

.submit-button {
    display: block;

    width: 100%;

    padding: 15px;

    border-radius: 30px;

    background: #f4a6b8;

    color: white;

    text-align: center;

    text-decoration: none;

    font-size: 16px;

    font-family: Georgia, serif;

    transition: 0.3s;
}

.submit-button:hover {
    background: #d9899d;

    transform: scale(1.02);
}

.back {
    display: inline-block;

    margin-top: 25px;

    color: #ffd6df;

    text-decoration: none;

    font-size: 14px;
}

</style>
</head>


<body>

<div class="rsvp-box">

    <div class="small">
        ADIL & MAHEK
    </div>

    <h1>
        RSVP
    </h1>

    <p class="subtitle">
        We would love to know your stay details
    </p>

    <p class="details">
        Please fill in your name, number of guests,
        check-in and check-out dates, and any message
        you would like to share with us.
    </p>

    <a
        href="https://forms.gle/vLoRjykqAdEDrixq9"
        class="submit-button"
        target="_blank">

        Continue to RSVP

    </a>

    <a href="index.html" class="back">
        ← Back to Invitation
    </a>

</div>

</body>

</html>
